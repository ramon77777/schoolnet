name: SCHOOLNET — Lot 5.C (Parent et deux enfants sandbox)

on:
  push:
    branches:
      - feature/schoolnet-lot5c-fiche-compacte-finalisation
    paths:
      - ".github/workflows/schoolnet-lot5c-siblings-sandbox-once.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: schoolnet-lot5c-siblings-sandbox-once
  cancel-in-progress: false

jobs:
  prepare-synthetic-only:
    name: Compte Parent réutilisé pour deux enfants (sandbox seule)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENDPOINT: https://onqlsvphmrqhelislpry.supabase.co/functions/v1/schoolnet-lot5c-siblings-sandbox-once
      AUDIENCE: schoolnet-lot5c-siblings-once
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4

      - name: Installer Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verifier le programme avant tout appel
        run: deno check --node-modules-dir=auto docs/sandbox/lot5c/siblings/edge/index.ts

      - name: Verifier que les appels anonymes sont refuses
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 25 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"mode":"preflight"}' "$ENDPOINT")
          [ "$code" = "401" ] || { echo "Refus anonyme non confirme (HTTP $code)"; exit 1; }
          echo "Connexion anonyme rejetee (HTTP 401)."

      - name: Recette unique de réutilisation du Parent
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          oidc_token=$(printf '%s' "$raw" | jq -er '.value')
          [ -n "$oidc_token" ] || exit 1

          invoke() {
            local mode="$1"
            local expected="$2"
            local tmp code stage
            tmp=$(mktemp)
            code=$(curl --silent --show-error --max-time 210 \
              --output "$tmp" --write-out '%{http_code}' \
              --request POST --header 'content-type: application/json' \
              --header "Authorization: Bearer $oidc_token" \
              --data "{\"mode\":\"$mode\"}" \
              "$ENDPOINT")
            if [ "$code" != "200" ] || ! jq -e "$expected" "$tmp" >/dev/null; then
              stage=$(jq -r '.stage // "response_inattendue"' "$tmp" 2>/dev/null || true)
              echo "SCHOOLNET Lot 5.C $mode ECHEC : HTTP $code ; etape=$stage"
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
            echo "SCHOOLNET Lot 5.C $mode : OK"
          }

          invoke preflight '.ok == true and .sandbox_only == true and .baseline_auth_users == 19 and .baseline_family_links == 2 and .existing_approval_rows == 0 and .ready_for_one_time_sibling_test == true'
          invoke run '.ok == true and .sandbox_only == true and .synthetic_auth_accounts_created == 3 and .one_parent_two_students == true and .only_one_parent_invitation == true and .duplicate_parent_invitation_blocked == true and .first_child_activated == true and .second_child_activation_without_approval_rejected == true and .failed_activation_rolled_back == true and .non_admin_approval_rejected == true and .distinct_second_child_approval_created == true and .approval_immutable == true and .second_child_autolink_activated == true and .second_activation_duplicate_blocked == true and .parent_links_for_both_children == 2 and .parent_child_ids_count == 2 and .parent_jwt_reads_two_children == true and .child_jwt_cannot_read_sibling == true and .no_annual_class_enrollment_required == true and .original_cases_unchanged == true and .real_messages_sent == false'
          # Un second appel ne doit ni recréer le lien ni réactiver.
          repeat_file=$(mktemp)
          repeat_code=$(curl --silent --show-error --max-time 40 \
            --output "$repeat_file" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header "Authorization: Bearer $oidc_token" \
            --data '{"mode":"run"}' "$ENDPOINT")
          if [ "$repeat_code" != "409" ] || ! jq -e \
            '.ok == false and .stage == "fixture_baseline_changed"' \
            "$repeat_file" >/dev/null; then
            echo "La seconde execution n'a pas ete refusee comme attendu (HTTP $repeat_code)"
            rm -f "$repeat_file"
            exit 1
          fi
          rm -f "$repeat_file"
          echo "Recette fratrie validee : 1 Parent, 1 invitation, 2 enfants et 2 liens."
