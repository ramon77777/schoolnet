name: SCHOOLNET S4-C.3-C.2 - official general averages pure contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4c3c2-general-averages-ci.yml'
      - 'src/features/schools/lib/schoolOfficialGeneralAverageMath.ts'
      - 'src/features/schools/lib/schoolOfficialAverageMath.ts'
      - 'scripts/test-schoolnet-s4c3c2-general-averages.mjs'
      - 'docs/releases/SCHOOLNET_S4C3C2_GENERAL_AVERAGES_CONTRACT_2026-11-25.md'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula-regression:
    name: C3-C.2 - reference math, completeness, no leaks, lint/build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4c3b1
      - run: npm run qa:s4c3c2
      - run: npm run qa:s4c3b2
      - run: npm run lint
      - run: npm run build
