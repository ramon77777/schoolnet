name: SCHOOLNET S4-B.3-A - rattachement des evaluations officielles
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4b3a-tenant-ci.yml'
      - 'tests/s4b3-tenant-ci/**'
      - 'supabase/proposals/s4b3a_school_assessment_links.sql'
      - 'supabase/verification/s4b3a_school_assessment_links_rollback_manual.sql'
      - 'src/features/schools/lib/schoolAssessmentBridge*'
      - 'src/features/teacher/components/TeacherSchoolAssessmentLinker.tsx'
      - 'src/features/teacher/pages/TeacherAssessmentDetail.tsx'
      - 'src/features/student/components/StudentSchoolCourseAssessments.tsx'
      - 'src/features/student/pages/StudentSchoolCourseDetail.tsx'
      - 'scripts/test-schoolnet-s4b3a-assessment-bridge.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: schoolnet-s4b3a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: S4-B.3-A - 20 contrats, lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer dependances verrouillees
        run: npm ci --no-audit --no-fund
      - name: Contrats S4-B.3-A
        run: npm run qa:s4b3a
      - name: Non-regression S4-B.2
        run: |
          npm run qa:s4b2
          npm run qa:s4b2-ui
          npm run qa:s4b2-r
      - name: ESLint
        run: npm run lint
      - name: Compilation TypeScript / Vite
        run: npm run build

  tenant-isolation:
    name: S4-B.3-A - evaluations A/B sur Supabase local jetable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Demarrer le sandbox isole sans lien avec le projet heberge
        working-directory: tests/s4b3-tenant-ci
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Initialiser schema CI V1, S3-C, S4-A et S4-B
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/legacy-minimal.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s3c_school_class_assignments.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4a_school_pedagogy_overview.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/course-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b1_school_course_bridge.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b2-tenant-ci/fixtures/course-content.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2_student_school_courses.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2r_teacher_course_class_summary.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3-tenant-ci/fixtures/assessment-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3a_school_assessment_links.sql
      - name: Tester opt-in, lecture etudiant, refus A/B, revocations et V1 intacte
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3-tenant-ci/fixtures/assessments-a-b.sql | tee /tmp/s4b3a-tests.txt
          grep -Fq 'S4B3A_TENANT_A_B_PASS' /tmp/s4b3a-tests.txt
      - name: Tester le rollback cible sans toucher aux RPC S4-B
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3a_school_assessment_links_rollback_manual.sql | tee /tmp/s4b3a-rollback.txt
          grep -Fq 'S4B3A_ROLLBACK_PASS' /tmp/s4b3a-rollback.txt
      - name: Nettoyer entierement la base jetable
        if: always()
        working-directory: tests/s4b3-tenant-ci
        run: supabase stop --no-backup || true
