name: SCHOOLNET S4-B.3-C.2 - school admin supervision
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4b3c2-supervision-ci.yml'
      - 'src/features/schools/**'
      - 'src/routes/router.tsx'
      - 'src/layouts/DashboardLayout.tsx'
      - 'supabase/proposals/s4b3c2_school_assessment_supervision.sql'
      - 'supabase/verification/s4b3c2*'
      - 'scripts/test-schoolnet-s4b3c2-supervision.mjs'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4b3c2
      - run: npm run qa:s4b3c1
      - run: npm run qa:s4b3b4
      - run: npm run qa:s4b3b3
      - run: npm run qa:s4a
      - run: npm run lint
      - run: npm run build

  tenant-isolation:
    name: S4-B.3-C.2 - supervision A/B et retour arriere
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Demarrer Supabase local jetable, jamais Supabase principal
        working-directory: tests/s4b3c1-tenant-ci
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reconstruire schema minimal V1 et V2
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/legacy-minimal.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s3c_school_class_assignments.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4a_school_pedagogy_overview.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/course-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b1_school_course_bridge.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b2-tenant-ci/fixtures/course-content.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2_student_school_courses.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2r_teacher_course_class_summary.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3-tenant-ci/fixtures/assessment-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3b0-tenant-ci/fixtures/submission-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3n-tenant-ci/fixtures/notification-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3a_school_assessment_links.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_school_assessment_notifications.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_legacy_assessment_notify_permission_hardening.sql
      - name: Tester le SQL B.0 sur postgres jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b0_official_assessment_security_foundation.sql | tee /tmp/b0-install.log
          grep -Fq 'S4B3B0_SECURITY_FOUNDATION_PASS' /tmp/b0-install.log
      - name: Installer B.1 uniquement dans le Postgres local
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b1_student_official_assessment_preview.sql | tee /tmp/b1-install.log
          grep -Fq 'S4B3B1_PREVIEW_SQL_PASS' /tmp/b1-install.log
      - name: Simuler les deux triggers V1 en Postgres jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3b2-tenant-ci/fixtures/legacy-attempt-triggers.sql
      - name: Installer la proposition B.2 UNIQUEMENT dans Postgres local
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b2_official_assessment_attempts.sql | tee /tmp/b2-install.log
          grep -Fq 'S4B3B2_OFFICIAL_ATTEMPTS_SQL_PASS' /tmp/b2-install.log
      - name: Tester acces des classes A/B, sans fuite de corrections
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3b1-tenant-ci/fixtures/preview-a-b.sql | tee /tmp/b1-tests.log
          grep -Fq 'S4B3B1_A_B_SAFE_PREVIEW_PASS' /tmp/b1-tests.log
      - name: Tester remise atomique, acces A/B, doublons et compatibilite V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3b2-tenant-ci/fixtures/attempts-a-b.sql | tee /tmp/b2-tests.log
          grep -Fq 'S4B3B2_A_B_SECURE_ATTEMPTS_PASS' /tmp/b2-tests.log
      - name: Simuler notification historique de correction V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3b3-tenant-ci/fixtures/legacy-correction-trigger.sql
      - name: Installer B.3 UNIQUEMENT en Postgres local jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b3_official_teacher_grading.sql | tee /tmp/b3-install.log
          grep -Fq 'S4B3B3_OFFICIAL_TEACHER_GRADING_PASS' /tmp/b3-install.log
      - name: Installer la notification de copie officielle en Postgres LOCAL uniquement
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b3n_official_teacher_submission_notifications.sql | tee /tmp/b3n-install.log
          grep -Fq 'S4B3B3N_SUBMISSION_NOTIFY_PASS' /tmp/b3n-install.log
      - name: Installer B.4 dans Postgres local jetable uniquement
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b4_student_official_dashboard.sql | tee /tmp/b4-install.log
          grep -Fq 'S4B3B4_STUDENT_OFFICIAL_DASHBOARD_PASS' /tmp/b4-install.log
      - name: Tester corrections A/B, notes confidentielles et publication unique
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3b4-tenant-ci/fixtures/dashboard-a-b.sql | tee /tmp/b3-tests.log
          grep -Fq 'S4B3B3_OFFICIAL_TEACHER_A_B_PASS' /tmp/b3-tests.log
      - name: Installer la projection C2 uniquement dans Postgres jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3c2_school_assessment_supervision.sql | tee /tmp/c2-install.log
          grep -Fq 'S4B3C2_SUPERVISION_PROPOSAL_PASS' /tmp/c2-install.log
      - name: Verifier acces et compteurs C2 sur ecoles A et B fictives
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3c2-tenant-ci/fixtures/supervision-a-b.sql 2>&1 | tee /tmp/c2-a-b.log
          grep -Fq 'C2_PASS_SCHOOL_A' /tmp/c2-a-b.log
          grep -Fq 'C2_PASS_SCHOOL_B' /tmp/c2-a-b.log
          grep -Fq 'C2_PASS_FOREIGN_SCHOOL_DENIED' /tmp/c2-a-b.log
          grep -Fq 'C2_PASS_REVOKED_ASSIGNMENT' /tmp/c2-a-b.log
      - name: Valider le retrait cible de la projection C2
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3c2_school_assessment_supervision_rollback_manual.sql | tee /tmp/c2-rollback.log
          grep -Fq 'S4B3C2_ROLLBACK_PASS' /tmp/c2-rollback.log
      - name: Reproduire les RPC parent V1 auditees, uniquement sur Postgres jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3c1-tenant-ci/fixtures/legacy-parent.sql
      - name: Installer C.1 et cloisonner les anciens acces parent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3c1_parent_official_results.sql | tee /tmp/c1-install.log
          grep -Fq 'S4B3C1_PARENT_OFFICIAL_RESULTS_PASS' /tmp/c1-install.log
      - name: Verifier le postflight en lecture seule et les refus sans identite
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/verification/s4b3c1_parent_official_results_postflight_readonly.sql | tee /tmp/c1-postflight.log
          grep -Fq 'S4B3C1_POSTFLIGHT_READONLY_PASS' /tmp/c1-postflight.log
      - name: Tester familles A/B, publication et refus des anciens chemins
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3c1-tenant-ci/fixtures/families-a-b.sql | tee /tmp/c1-tests.log
          grep -Fq 'S4B3C1_PARENT_RESULTS_A_B_PASS' /tmp/c1-tests.log
      - name: Retirer le nouveau parcours, conserver le cloisonnement V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3c1_parent_official_results_rollback_manual.sql | tee /tmp/c1-rollback.log
          grep -Fq 'S4B3C1_PARENT_OFFICIAL_RESULTS_ROLLBACK_PASS' /tmp/c1-rollback.log
      - name: Verifier les refus officiels V1 apres retrait de C.1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3c1-tenant-ci/fixtures/rollback-a-b.sql | tee /tmp/c1-rollback-tests.log
          grep -Fq 'S4B3C1_ROLLBACK_V1_GUARDS_PASS' /tmp/c1-rollback-tests.log
      - name: Verifier restauration historique et refus de derive C.1
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54342/postgres
        run: |
          set -euo pipefail
          bash tests/s4b3c1-tenant-ci/verify-safe-install-and-legacy-restore.sh | tee /tmp/c1-safe-restore.log
          grep -Fq 'S4B3C1_SAFE_INSTALL_AND_LEGACY_RESTORE_PASS' /tmp/c1-safe-restore.log
      - name: Verifier le retour arriere B.4 sur Postgres local uniquement
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b4_student_official_dashboard_rollback_manual.sql | tee /tmp/b4-rollback.log
          grep -Fq 'S4B3B4_STUDENT_OFFICIAL_DASHBOARD_ROLLBACK_PASS' /tmp/b4-rollback.log
      - name: Restaurer le notifier historique B.2 apres les tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b3n_official_teacher_submission_notifications_rollback_manual.sql | tee /tmp/b3n-rollback.log
          grep -Fq 'S4B3B3N_SUBMISSION_NOTIFY_ROLLBACK_PASS' /tmp/b3n-rollback.log
      - name: Valider rollback B.3, sans affecter B.2
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b3_official_teacher_grading_rollback_manual.sql | tee /tmp/b3-rollback.log
          grep -Fq 'S4B3B3_OFFICIAL_GRADING_ROLLBACK_PASS' /tmp/b3-rollback.log
      - name: Tester rollback B.2 sans perte des protections B.1/B.0
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b2_official_assessment_attempts_rollback_manual.sql | tee /tmp/b2-rollback.log
          grep -Fq 'S4B3B2_ROLLBACK_PASS' /tmp/b2-rollback.log
      - name: Tester le rollback B.1 sans retirer B.0
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b1_student_official_assessment_preview_rollback_manual.sql | tee /tmp/b1-rollback.log
          grep -Fq 'S4B3B1_PREVIEW_ROLLBACK_PASS' /tmp/b1-rollback.log
      - name: Nettoyer environnement local
        if: always()
        working-directory: tests/s4b3c1-tenant-ci
        run: supabase stop --no-backup || true
