name: SCHOOLNET S4-D.3g - school report card approval role governance
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d3f-approval-workflow-preparation-20261127
    paths:
      - 'src/features/official-documents/lib/schoolReportCardApprovalGovernance.ts'
      - 'src/features/official-documents/pages/SchoolReportCardRoleGovernancePanel.tsx'
      - 'src/features/official-documents/pages/SchoolReportCardApprovalPreparationPanel.tsx'
      - 'scripts/test-schoolnet-s4d3g-approval-governance.mjs'
      - 'docs/releases/SCHOOLNET_S4D3G_ROLE_GOVERNANCE_2026-11-27.md'
      - '.github/workflows/schoolnet-s4d3g-role-governance-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d3g-governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  school-admin-governance:
    name: Proposed roles, no granted approvals, regressions, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d3g
      - run: npm run qa:s4d3f
      - run: npm run qa:s4d3e
      - run: npm run qa:s4d3d
      - run: npm run qa:s4d3c
      - run: npm run qa:s4d3b
      - run: npm run qa:s4d3a
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4c3c4
      - run: npm run qa:s4c5
      - run: npm run lint
      - run: npm run build
