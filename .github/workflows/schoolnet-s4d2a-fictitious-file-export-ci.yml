name: SCHOOLNET S4-D.2a - genuine fictional PDF XLSX file exports
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d1-reportcards-exports-foundation-20261126
    paths:
      - 'src/features/official-documents/**'
      - 'scripts/test-schoolnet-s4d2a-file-export.mjs'
      - 'docs/releases/SCHOOLNET_S4D2A_FICTITIOUS_EXPORTS_2026-11-26.md'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/schoolnet-s4d2a-fictitious-file-export-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d2a-renderers
  cancel-in-progress: true
jobs:
  validate-pdf-xlsx-fictitious:
    name: Validate fictional PDF and XLSX bytes, export permissions and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d2a
      - run: npm run qa:s4d1
      - run: npm run qa:s4c3c4
      - run: npm run qa:s4c3c3533
      - run: npm run qa:s4c3b6-1
      - run: npm run lint
      - run: npm run build
