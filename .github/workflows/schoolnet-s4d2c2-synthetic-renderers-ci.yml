name: SCHOOLNET S4-D.2c.2 - synthetic PDF and XLSX preview templates
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d2c1-provisional-export-api-20261126
    paths:
      - 'src/features/official-documents/lib/schoolSyntheticPreview*.ts'
      - 'scripts/fixtures/schoolnet-s4d2c2-synthetic-preview.mjs'
      - 'scripts/test-schoolnet-s4d2c2-synthetic-renderers.mjs'
      - 'scripts/generate-schoolnet-s4d2c2-samples.mjs'
      - 'docs/releases/SCHOOLNET_S4D2C2_SYNTHETIC_RENDERERS_2026-11-26.md'
      - '.github/workflows/schoolnet-s4d2c2-synthetic-renderers-ci.yml'
      - 'vercel.json'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d2c2-synthetic-renderers
  cancel-in-progress: true
jobs:
  safe-sample-exports:
    name: Validate synthetic PDF/XLSX and previous SCHOOLNET contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4d2c1
      - run: npm run qa:s4d2b
      - run: npm run qa:s4d2a
      - run: npm run qa:s4d1
      - run: npm run qa:s4c3c4
      - run: npm run demo:s4d2c2
      - run: npm run lint
      - run: npm run build
