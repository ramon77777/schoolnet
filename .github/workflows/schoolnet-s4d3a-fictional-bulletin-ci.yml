name: SCHOOLNET S4-D.3a - fictional individual V2 report card preview
on:
  pull_request:
    branches:
      - feature/schoolnet-s4c5-general-student-review-20261126
    paths:
      - 'src/features/official-documents/lib/schoolFictionalReportCardPreview.ts'
      - 'src/features/official-documents/pages/SchoolFictionalReportCardDemo.tsx'
      - 'src/features/official-documents/pages/SchoolOfficialDocumentsHub.tsx'
      - 'scripts/test-schoolnet-s4d3a-fictional-bulletin.mjs'
      - 'docs/releases/SCHOOLNET_S4D3A_FICTIONAL_BULLETIN_PREVIEW_2026-11-26.md'
      - '.github/workflows/schoolnet-s4d3a-fictional-bulletin-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d3a-fictional-bulletin
  cancel-in-progress: true
jobs:
  fictional-report-card:
    name: Functional bulletin preview QA and current screens
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d3a
      - run: npm run qa:s4c5
      - run: npm run qa:s4c3c4
      - run: npm run qa:s4d2c2
      - run: npm run lint
      - run: npm run build
