name: SCHOOLNET C.3.5.3.7 - fictional PostgreSQL restore rehearsal
on:
  pull_request:
    branches:
      - feature/schoolnet-s4c3c3536-privileged-review-recovery-20261126
    paths:
      - 'tests/s4c3c3537/**'
      - 'scripts/test-schoolnet-s4c3c3537-disposable-restore.mjs'
      - 'docs/releases/SCHOOLNET_S4C3C3537_FICTITIOUS_RESTORE_REHEARSAL_2026-11-26.md'
      - '.github/workflows/schoolnet-s4c3c3537-disposable-restore-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-c3537-fictitious-rehearsal
  cancel-in-progress: true
jobs:
  contract-regressions:
    name: Windows-compatible tests and previous SCHOOLNET no-go gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4c3c3537
      - run: npm run qa:s4c3c3536
      - run: npm run qa:s4c3c3535
      - run: npm run qa:s4c3c3534
      - run: npm run qa:s4c3c353
      - run: npm run qa:s4c3c3533
      - run: npm run qa:s4d2c4
      - run: npm run qa:s4d2c3
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4d2c1
      - run: npm run qa:s4d2b
      - run: npm run qa:s4d2a
      - run: npm run qa:s4d1
      - run: npm run qa:s4c3c4
      - run: npm run lint
      - run: npm run build

  synthetic-postgres-restore:
    name: Independent PostgreSQL 17 source and restore with fake Storage bytes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      source:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: schoolnet_fictitious_ci_only
          POSTGRES_DB: schoolnet_synthetic
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_synthetic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      target:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: schoolnet_fictitious_ci_only
          POSTGRES_DB: schoolnet_synthetic
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_synthetic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rehearse actual binary pg_dump, pg_restore, RLS and separate blob bytes
        env:
          CI: 'true'
        run: bash tests/s4c3c3537/run-disposable-restore.sh
