name: SCHOOLNET S4-D.2c.3 - deterministic synthetic roster integrity
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d2c2-synthetic-preview-renderers-20261126
    paths:
      - 'src/features/official-documents/lib/schoolSyntheticRosterOrder.ts'
      - 'src/features/official-documents/lib/schoolSyntheticPreviewDocument.ts'
      - 'src/features/official-documents/lib/schoolSyntheticPreviewPdf.ts'
      - 'scripts/test-schoolnet-s4d2c3-integrity.mjs'
      - 'docs/releases/SCHOOLNET_S4D2C3_SYNTHETIC_INTEGRITY_2026-11-26.md'
      - '.github/workflows/schoolnet-s4d2c3-synthetic-integrity-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d2c3-synthetic
  cancel-in-progress: true
jobs:
  deterministic-document-contracts:
    name: Verify stable roster and existing export boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d2c3
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4d2c1
      - run: npm run qa:s4d2b
      - run: npm run qa:s4d2a
      - run: npm run qa:s4d1
      - run: npm run qa:s4c3c4
      - run: npm run demo:s4d2c2
      - run: npm run lint
      - run: npm run build
