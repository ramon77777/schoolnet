name: SCHOOLNET C.3.5.3.4 - read-only hosted migration parity audit
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d2c4-authorized-metadata-20261126
    paths:
      - 'tests/s4c3c3534/**'
      - 'scripts/test-schoolnet-s4c3c3534-readonly-parity.mjs'
      - 'docs/releases/SCHOOLNET_S4C3C3534_READONLY_PARITY_2026-11-26.md'
      - '.github/workflows/schoolnet-s4c3c3534-readonly-parity-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-c3534-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof-and-existing-regressions:
    name: Verify captured catalog facts and closed SCHOOLNET release gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4c3c3534
      - run: npm run qa:s4c3c353
      - run: npm run qa:s4c3c3533
      - run: npm run qa:s4d2c4
      - run: npm run qa:s4d2c3
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4d2c1
      - run: npm run qa:s4d2b
      - run: npm run qa:s4d2a
      - run: npm run qa:s4d1
      - run: npm run qa:s4c3c4
      - run: npm run lint
      - run: npm run build
