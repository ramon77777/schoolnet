name: SCHOOLNET S4-B.3-B.0 - securite des evaluations
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4b3b0-security-ci.yml'
      - 'supabase/proposals/s4b3b0_official_assessment_security_foundation.sql'
      - 'supabase/verification/s4b3b0_official_assessment_security_rollback_manual.sql'
      - 'tests/s4b3b0-tenant-ci/**'
      - 'scripts/test-schoolnet-s4b3b0-security.mjs'
      - 'docs/releases/SCHOOLNET_S4B3B0_SECURITY_FOUNDATION_2026-11-20.md'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4b3b0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: S4-B.3-B.0 - contrats, regressions, lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dependances verrouillees
        run: npm ci --no-audit --no-fund
      - name: QA des restrictions B.0
        run: npm run qa:s4b3b0
      - name: Non-regression V2
        run: |
          npm run qa:s4b3a
          npm run qa:s4b3n
          npm run qa:s4b2
          npm run qa:s4b2-ui
          npm run qa:s4b2-r
      - name: ESLint
        run: npm run lint
      - name: Compiler TypeScript Vite
        run: npm run build
  tenant-isolation:
    name: S4-B.3-B.0 - SQL A/B et rollback sur base locale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Demarrer Supabase local jetable, jamais Supabase principal
        working-directory: tests/s4b3-tenant-ci
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reconstruire schema minimal V1 et V2
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/legacy-minimal.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s3c_school_class_assignments.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4a_school_pedagogy_overview.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/course-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b1_school_course_bridge.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b2-tenant-ci/fixtures/course-content.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2_student_school_courses.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2r_teacher_course_class_summary.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3-tenant-ci/fixtures/assessment-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3b0-tenant-ci/fixtures/submission-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3n-tenant-ci/fixtures/notification-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3a_school_assessment_links.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_school_assessment_notifications.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_legacy_assessment_notify_permission_hardening.sql
      - name: Tester le SQL B.0 sur postgres jetable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3b0_official_assessment_security_foundation.sql | tee /tmp/b0-install.log
          grep -Fq 'S4B3B0_SECURITY_FOUNDATION_PASS' /tmp/b0-install.log
      - name: Tester protections A/B et compatibilite V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3b0-tenant-ci/fixtures/security-a-b.sql | tee /tmp/b0-tests.log
          grep -Fq 'S4B3B0_SECURITY_A_B_PASS' /tmp/b0-tests.log
      - name: Tester le rollback B.0 dans PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3b0_official_assessment_security_rollback_manual.sql | tee /tmp/b0-rollback.log
          grep -Fq 'S4B3B0_SECURITY_ROLLBACK_PASS' /tmp/b0-rollback.log
      - name: Nettoyer environnement local
        if: always()
        working-directory: tests/s4b3-tenant-ci
        run: supabase stop --no-backup || true
