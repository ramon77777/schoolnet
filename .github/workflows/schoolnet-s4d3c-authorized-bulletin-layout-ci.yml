name: SCHOOLNET S4-D.3c - validated individual bulletin layout
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d3b-authorized-subject-lines-20261126
    paths:
      - 'src/features/official-documents/pages/SchoolAuthorizedReportCardLayout.tsx'
      - 'src/features/official-documents/pages/SchoolAuthorizedStudentReportCard.tsx'
      - 'src/features/schools/pages/LocalSchoolOfficialGeneralAverages.tsx'
      - 'scripts/test-schoolnet-s4d3c-authorized-bulletin-layout.mjs'
      - 'docs/releases/SCHOOLNET_S4D3C_AUTHORIZED_BULLETIN_LAYOUT_2026-11-27.md'
      - '.github/workflows/schoolnet-s4d3c-authorized-bulletin-layout-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d3c-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-card-layout:
    name: Bounded bulletin layout, legacy regression, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d3c
      - run: npm run qa:s4d3b
      - run: npm run qa:s4d3a
      - run: npm run lint
      - run: npm run build
