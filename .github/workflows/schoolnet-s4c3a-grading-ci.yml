name: SCHOOLNET S4-C.3-A - official grading configuration (draft)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4c3a-grading-ci.yml'
      - 'src/features/schools/lib/schoolGradeConfiguration*'
      - 'src/features/schools/pages/LocalSchoolGradeConfiguration.tsx'
      - 'src/routes/router.tsx'
      - 'src/layouts/DashboardLayout.tsx'
      - 'supabase/proposals/s4c3a_official_periods_coefficients.sql'
      - 'scripts/test-schoolnet-s4c3a-periods.mjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4c3a
      - run: npm run qa:s4b3c2
      - run: npm run lint
      - run: npm run build

  tenant-isolation:
    name: C3-A - SQL A/B local jetable et rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Demarrer PostgreSQL Supabase local - aucune cle de production
        working-directory: tests/s4b3c1-tenant-ci
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reconstruire le contrat SQL minimal de S3-C a B.3-A
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in \
            tests/s4b1-tenant-ci/fixtures/legacy-minimal.sql \
            supabase/proposals/s3c_school_class_assignments.sql \
            supabase/proposals/s4a_school_pedagogy_overview.sql \
            tests/s4b1-tenant-ci/fixtures/course-core.sql \
            supabase/proposals/s4b1_school_course_bridge.sql \
            tests/s4b2-tenant-ci/fixtures/course-content.sql \
            supabase/proposals/s4b2_student_school_courses.sql \
            supabase/proposals/s4b2r_teacher_course_class_summary.sql \
            tests/s4b3-tenant-ci/fixtures/assessment-core.sql \
            tests/s4b3b0-tenant-ci/fixtures/submission-core.sql \
            supabase/proposals/s4b3a_school_assessment_links.sql
          do
            psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f "$file" > /dev/null
          done
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE public.school_years ADD COLUMN starts_on date NOT NULL DEFAULT DATE '2026-09-01', ADD COLUMN ends_on date NOT NULL DEFAULT DATE '2027-07-31';"
      - name: Installer proposition C3-A sur PostgreSQL LOCAL uniquement
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 \
            -f supabase/proposals/s4c3a_official_periods_coefficients.sql 2>&1 | tee /tmp/c3a-install.log
          grep -Fq 'S4C3A_G2_PROPOSAL_ONLY' /tmp/c3a-install.log
      - name: Tester A/B, ecritures, verrouillage, roles et revision de liens
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/s4c3a-tenant-ci/fixtures/periods-a-b.sql 2>&1 | tee /tmp/c3a-tests.log
          for proof in C3A_PASS_READ_A C3A_PASS_FOREIGN_READ_DENIED \
            C3A_PASS_FOREIGN_WRITE_DENIED C3A_PASS_PERIODS_A \
            C3A_PASS_OVERLAP_DENIED C3A_PASS_COEFFICIENTS_A \
            C3A_PASS_FOREIGN_CLASS_DENIED C3A_PASS_FOREIGN_ASSESSMENT_DENIED \
            C3A_PASS_V1_DENIED C3A_PASS_ZERO_COEFF_DENIED C3A_PASS_LOCKED_PERIOD \
            C3A_PASS_SCHOOL_B_SAME_CODE C3A_PASS_TEACHER_DENIED \
            C3A_PASS_REVOKED_ADMIN_DENIED C3A_PASS_ANON_DENIED \
            S4C3A_TENANT_FIXTURE_ROLLED_BACK
          do
            grep -Fq "$proof" /tmp/c3a-tests.log
          done
      - name: Verifier rollback cible C3-A sur PostgreSQL LOCAL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 \
            -f supabase/verification/s4c3a_official_periods_coefficients_rollback_manual.sql 2>&1 | tee /tmp/c3a-rollback.log
          grep -Fq 'S4C3A_ROLLBACK_PASS' /tmp/c3a-rollback.log
