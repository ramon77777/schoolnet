name: SCHOOLNET S4-B.3-N - notifications evaluations officielles
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/schoolnet-s4b3n-notification-ci.yml'
      - 'tests/s4b3n-tenant-ci/**'
      - 'supabase/proposals/s4b3n_school_assessment_notifications.sql'
      - 'supabase/migrations/20261120130939_schoolnet_s4b3n_official_assessment_notifications.sql'
      - 'supabase/proposals/s4b3n_legacy_assessment_notify_permission_hardening.sql'
      - 'supabase/migrations/20261120132205_schoolnet_s4b3n_legacy_assessment_notify_permission_hardening.sql'
      - 'supabase/verification/s4b3n_legacy_assessment_notify_permission_rollback_manual.sql'
      - 'docs/releases/SCHOOLNET_S4B3N_NOTIFICATIONS_EVALUATIONS_2026-11-20.md'
      - 'supabase/verification/s4b3n_school_assessment_notifications_rollback_manual.sql'
      - 'src/features/notifications/pages/NotificationsPage.tsx'
      - 'scripts/test-schoolnet-s4b3n-notifications.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: schoolnet-s4b3n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: S4-B.3-N - contrats, regression, lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dependances verrouillees
        run: npm ci --no-audit --no-fund
      - name: Verifier contrats notifications S4-B.3-N
        run: npm run qa:s4b3n
      - name: Verifier non-regression S4-B.3-A et S4-B.2
        run: |
          npm run qa:s4b3a
          npm run qa:s4b2
          npm run qa:s4b2-ui
          npm run qa:s4b2-r
      - name: ESLint
        run: npm run lint
      - name: Compiler TypeScript et Vite
        run: npm run build

  tenant-isolation:
    name: S4-B.3-N - A/B et V1 sur Supabase local jetable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Demarrer Supabase local isole (jamais le projet heberge)
        working-directory: tests/s4b3-tenant-ci
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reconstruire schema minimal V1 et liens officiels
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/legacy-minimal.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s3c_school_class_assignments.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4a_school_pedagogy_overview.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b1-tenant-ci/fixtures/course-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b1_school_course_bridge.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b2-tenant-ci/fixtures/course-content.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2_student_school_courses.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b2r_teacher_course_class_summary.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3-tenant-ci/fixtures/assessment-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4b3n-tenant-ci/fixtures/notification-core.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3a_school_assessment_links.sql
          psql -X -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_school_assessment_notifications.sql
      - name: Tester le durcissement du trigger V1 sur base locale
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/proposals/s4b3n_legacy_assessment_notify_permission_hardening.sql | tee /tmp/s4b3n-acl-revoke.txt
          grep -Fq 'S4B3N_PERMISSIONS_HARDENING_PASS' /tmp/s4b3n-acl-revoke.txt
      - name: Tester transitions, affectations A/B, dedoublonnage et V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/s4b3n-tenant-ci/fixtures/notifications-a-b.sql | tee /tmp/s4b3n-tests.txt
          grep -Fq 'S4B3N_TENANT_A_B_PASS' /tmp/s4b3n-tests.txt
      - name: Tester le rollback des seuls droits V1 sur base locale
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3n_legacy_assessment_notify_permission_rollback_manual.sql | tee /tmp/s4b3n-acl-rollback.txt
          grep -Fq 'S4B3N_PERMISSIONS_ROLLBACK_PASS' /tmp/s4b3n-acl-rollback.txt
      - name: Verifier le rollback sans toucher a S4-B.3-A ni aux migrations V1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -A -t -h 127.0.0.1 -p 54342 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f supabase/verification/s4b3n_school_assessment_notifications_rollback_manual.sql | tee /tmp/s4b3n-rollback.txt
          grep -Fq 'S4B3N_ROLLBACK_PASS' /tmp/s4b3n-rollback.txt
      - name: Nettoyer la base locale jetable
        if: always()
        working-directory: tests/s4b3-tenant-ci
        run: supabase stop --no-backup || true
