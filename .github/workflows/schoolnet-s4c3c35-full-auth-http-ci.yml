name: SCHOOLNET S4-C.3-C.3.5.1 - disposable Supabase Auth and RLS HTTP
on:
  pull_request:
    branches:
      - feature/schoolnet-s4c3c34-security-audit-20261126
    paths:
      - '.github/workflows/schoolnet-s4c3c35-full-auth-http-ci.yml'
      - 'tests/s4c3c35-supabase-ci/**'
      - 'scripts/test-schoolnet-s4c3c35-isolated-supabase-plan.mjs'
      - 'docs/releases/SCHOOLNET_S4C3C35_ISOLATED_SUPABASE_2026-11-26.md'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-c3c35-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: C3-C.3.5.1 - guards and regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4c3c34
      - run: npm run qa:s4c3c35
      - run: npm run lint
      - run: npm run build
  isolated-auth-http:
    name: C3-C.3.5.1 - real Auth JWT, PostgREST and RLS, ephemeral
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable Supabase, retaining Auth + Kong + PostgREST
        working-directory: tests/s4c3c35-supabase-ci
        run: |
          set -euo pipefail
          supabase --version
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Install only a fake HTTP RLS canary in local database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 55422 -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f tests/s4c3c35-supabase-ci/fixtures/http-rls-probe.sql
      - name: Exercise real isolated GoTrue JWT, REST API and RLS
        working-directory: tests/s4c3c35-supabase-ci
        run: |
          set -euo pipefail
          set -a
          source <(supabase status -o env)
          set +a
          test "${API_URL}" = "http://127.0.0.1:55421"
          node --test auth-postgrest-smoke.mjs
      - name: Destroy all local Supabase volumes and fake users
        if: always()
        working-directory: tests/s4c3c35-supabase-ci
        run: supabase stop --no-backup || true
