name: SCHOOLNET - Qualite integration Lot 5.C (local-first)
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/schoolnet-lot5c-local-first]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-local-first-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, build et Edge checks sans deploiement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Compiler l'application Vite/TypeScript
        run: npm run build
      - name: Verifier Lot 5D-A (lecture seule, sans acces Supabase)
        run: npm run qa:lot5d:a
      - name: Verifier Lot 5D-B (preflight et SQL non installable, sans reseau)
        run: npm run qa:lot5d:b
      - name: Verifier Lot 5D-C (candidat consolide, securite hors reseau)
        run: npm run qa:lot5d:c
      - name: Verifier Lot 5D-D (concurrence et contrat backend non deploye)
        run: npm run qa:lot5d:d
      - name: Verifier Lot 5D-E (archives, RPC legacy et passerelle en mock)
        run: npm run qa:lot5d:e
      - name: Verifier Lot 5D-F (RPC completes hors reseau)
        run: npm run qa:lot5d:f
      - name: Verifier Lot 5D-G (catalogue reel, voies directes, passerelle mock)
        run: npm run qa:lot5d:g
      - name: Verifier Lot 5D-H (integrite Storage et classes historiques)
        run: npm run qa:lot5d:h
      - name: Verifier les garde-fous de cohorte et d'environnement
        run: node --experimental-strip-types --test scripts/test-schoolnet-student-runtime-gate.mjs scripts/test-schoolnet-student-rollout-guard.mjs
      - name: Tester UI, login, rattachement et Parent existant (hors ligne)
        run: node --test scripts/test-schoolnet-no-email-auto-family-link.mjs scripts/test-schoolnet-student-login-production-release.mjs scripts/test-schoolnet-lot5c-ui-compact.mjs scripts/test-schoolnet-lot5c-sibling-parent-reuse.mjs scripts/test-schoolnet-lot5c-admin-parent-reuse.mjs
      - name: Controler la proposition SQL principale (hors ligne, aucune execution)
        run: node --test scripts/test-schoolnet-lot5c-main-install.mjs
      - name: Tester deux enfants lies avec ou sans affectation en classe
        run: node --experimental-strip-types --test scripts/test-schoolnet-lot5c-parent-children.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verification de compilation des fonctions Edge (aucun deploiement)
        run: deno check --node-modules-dir=auto supabase/functions/schoolnet-student-no-email-admin/index.ts supabase/functions/schoolnet-student-login-release/index.ts
      - name: Verifier les fonctions famille deja presentes
        run: deno check --node-modules-dir=auto supabase/functions/schoolnet-family-invitation/index.ts
      - name: Tests famille deja presents
        run: deno test supabase/functions/_shared/familyActivationEvidence_test.ts

  lot5d_sql_sandbox:
    name: Test 5D-A+B sur PostgreSQL 17 jetable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Verifier cible ephemere et client PostgreSQL
        shell: bash
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql --version
      - name: Installer fixture, candidat consolide, recette rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f scripts/lot5d/test_consolidated_postgresql17.sql
      - name: Verifier aucun changement d annee apres la recette
        shell: bash
        run: |
          set -euo pipefail
          count=$(psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.school_years WHERE is_current AND name='2025-2026'")
          test "$count" = "1"
      - name: Verifier les contraintes classe et role du schema de production en fixture
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/schema_compatibility_postgresql17.sql
      - name: Simuler deux sessions concurrentes et verifier replay idempotent
        shell: bash
        run: bash scripts/lot5d/run_concurrency_postgresql17.sh
      - name: Verifier permissions reelles SQL avec SET ROLE et RLS fictive
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/authorization_postgresql17.sql

  lot5d_legacy_cross:
    name: Lot 5D-E - concurrence RPC et archives sur PostgreSQL 17 fictif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Confirmer exclusivement la base fictive
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          test -z "$(printenv SUPABASE_DB_URL || true)"
          test -z "$(printenv DATABASE_URL || true)"
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql --version
      - name: Installer les fixtures et les gardes candidats 5D-E
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5de_history_guards_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/legacy_rpc_guarded_fixture_postgresql17.sql
      - name: Tester une fonction legacy concurrente, archives et reprise
        shell: bash
        run: bash scripts/lot5d/run_legacy_cross_postgresql17.sh
      - name: Confirmer le nombre de passages apres la recette
        shell: bash
        run: |
          set -euo pipefail
          run_count=$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.school_year_rollover_runs")
          source_count=$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.student_enrollments WHERE school_year_id='20252025-2025-4025-8025-202520252025' AND status='completed'")
          test "$run_count" = "1"
          test "$source_count" = "1"

  # Lot 5D-F: two independent, disposable Postgres instances to validate
  # the FULL read-only-audited legacy RPC definitions, not shortened mocks.
  lot5d_full_rpc:
    name: Lot 5D-F - RPC completes, releve et archives (PG17 fictif)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Confirmer cible PostgreSQL ephemere et clients disponibles
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          test -z "$(printenv DATABASE_URL || true)"
          test -z "$(printenv SUPABASE_DB_URL || true)"
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Installer seulement le schema synthétique et les propositions F sandbox
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5de_history_guards_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5df_fixture_enhance_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5df_legacy_full_lock_SANDBOX_ONLY.sql
      - name: Recette du comportement historique avant bascule avec ROLLBACK
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5df_full_regression_pre_postgresql17.sql
      - name: Concurrence finaliseur avec RPC upsert COMPLETE
        shell: bash
        run: bash scripts/lot5d/5df_run_cross_postgresql17.sh upsert
      - name: Compteurs apres tests rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.school_year_rollover_runs")" = "1"
          test "$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.student_enrollments WHERE school_year_id='20252025-2025-4025-8025-202520252025' AND status='completed'")" = "1"

  lot5d_full_status:
    name: Lot 5D-F - verrou annee AVANT statut en concurrence (PG17 fictif)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Installer fixture + candidat F sur la base PG17 fictive seulement
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          test -z "$(printenv SUPABASE_DB_URL || true)"
          test -z "$(printenv DATABASE_URL || true)"
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5de_history_guards_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5df_fixture_enhance_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5df_legacy_full_lock_SANDBOX_ONLY.sql
      - name: Concurrence finaliseur avec RPC statut COMPLETE
        shell: bash
        run: bash scripts/lot5d/5df_run_cross_postgresql17.sh status

  # 5D-G: direct-write + archived-document guard on metadata-aligned synthetic
  # PostgreSQL, never on the principal Supabase project. Do not deploy.
  lot5d_direct_paths:
    name: Lot 5D-G - droits RLS, ecritures directes et archives PG17 jetable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Prouver base locale fictive et aucun secret Supabase
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          test "$PGUSER" = "postgres"
          for key in SUPABASE_DB_URL DATABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            test -z "$(printenv "$key" || true)"
          done
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Installer uniquement des fixtures PG17 et les gardes SANDBOX_ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5de_history_guards_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_schema_parity_fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5dg_archive_documents_SANDBOX_ONLY.sql
      - name: Verifier droits Admin et anon avant cloture sous ROLLBACK
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_direct_paths_pre_postgresql17.sql
      - name: Creer une piece et une decision fictives
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_prepare_document_postgresql17.sql
      - name: Finaliser une annee fictive sans donnees reelles
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_finalize_document_postgresql17.sql
      - name: Verifier archives immuables et nouvelle annee utilisable (ROLLBACK)
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_direct_paths_post_postgresql17.sql
      - name: Controler compteurs fictifs apres la recette ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          count=$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.school_year_rollover_runs")
          docs=$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.student_enrollment_documents")
          test "$count" = "1"
          test "$docs" = "1"

  # Lot 5D-H - separate fictional Postgres instance. DO NOT use real Storage.
  # Storage schema is a simplified RLS fixture; never SQL-delete real files.
  lot5d_storage_hardening:
    name: Lot 5D-H - Storage RLS sans effacement et archive (PG17 fictif)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolnet_lot5d_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schoolnet_lot5d_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolnet_lot5d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schoolnet_lot5d_ci
      PGUSER: postgres
      PGPASSWORD: schoolnet_lot5d_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Refuser toute connexion Supabase externe
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "schoolnet_lot5d_ci"
          test "$PGUSER" = "postgres"
          for key in SUPABASE_DB_URL DATABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            test -z "$(printenv "$key" || true)"
          done
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Installer uniquement les fixtures et protections SQL SANDBOX_ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5d_ab_consolidated_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5de_history_guards_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_schema_parity_fixture_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5dg_archive_documents_SANDBOX_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dh_storage_objects_fixture_postgresql17.sql
      - name: Prouver la suppression permise par ancienne RLS fictive sous ROLLBACK
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dh_storage_delete_before_postgresql17.sql
      - name: Appliquer le garde Storage H UNIQUEMENT a la fixture jetable
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/20261118_schoolnet_lot5dh_storage_delete_SANDBOX_ONLY.sql
      - name: Preparer et finaliser un dossier scolaire fictif (G, sans reseau)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_prepare_document_postgresql17.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dg_finalize_document_postgresql17.sql
      - name: Prouver refus DELETE, maintien SELECT/INSERT et conservation d'archives
        shell: bash
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/lot5d/5dh_storage_delete_after_postgresql17.sql
      - name: Verifier les compteurs Storage fictifs et annees apres ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.school_year_rollover_runs")" = "1"
          test "$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM storage.objects")" = "0"
          test "$(psql -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM public.student_enrollment_documents")" = "1"
