name: SCHOOLNET S4-D.3h - unapproved bulletin publication policy
on:
  pull_request:
    branches:
      - feature/schoolnet-s4d3g-approval-role-governance-20261127
    paths:
      - 'src/features/official-documents/lib/schoolBulletinPublicationPolicyDraft.ts'
      - 'src/features/official-documents/pages/SchoolBulletinPublicationPolicyDraftPanel.tsx'
      - 'src/features/official-documents/pages/SchoolReportCardRoleGovernancePanel.tsx'
      - 'scripts/test-schoolnet-s4d3h-publication-policy-draft.mjs'
      - 'docs/releases/SCHOOLNET_S4D3H_PUBLICATION_POLICY_DRAFT_2026-11-27.md'
      - '.github/workflows/schoolnet-s4d3h-publication-policy-ci.yml'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolnet-s4d3h-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nonoperational-policy:
    name: Proposed rules, zero grants, previous regressions, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:s4d3h
      - run: npm run qa:s4d3g
      - run: npm run qa:s4d3f
      - run: npm run qa:s4d3e
      - run: npm run qa:s4d3d
      - run: npm run qa:s4d3c
      - run: npm run qa:s4d3b
      - run: npm run qa:s4d3a
      - run: npm run qa:s4d2c2
      - run: npm run qa:s4c3c4
      - run: npm run qa:s4c5
      - run: npm run lint
      - run: npm run build
